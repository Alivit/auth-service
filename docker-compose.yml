services:
  keycloak-postgres:
    container_name: keycloak_postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_EXTERNAL_PORT}:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}" ]
      interval: 3s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_postgres:5432/keycloak_db
      KC_DB_USER: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB_POOL_INITIAL_SIZE: 15
      KC_DB_POOL_MIN_SIZE: 15
      KC_DB_POOL_MAX_SIZE: 15
      KC_TRANSACTION_XA_ENABLED: "false"
      KC_HOSTNAME_STRICT: "false"
      KC_FEATURES: "http-optimized-serializers"
      JAVA_OPTS_APPEND: "-Xms512m -Xmx1024m"
    ports:
      - "${KEYCLOAK_EXTERNAL_PORT}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/dev-realm.json:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    links:
      - "keycloak-postgres:postgres"

  auth-service:
    container_name: auth-service
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SERVER_PORT=8082
    ports:
      - "${AUTH_SERVICE_EXTERNAL_PORT}:8082"
      - "9090:9090"
    env_file:
      - '.env'
    depends_on:
      - keycloak
networks:
  default:
    name: minispring-network